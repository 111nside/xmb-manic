name: Build XMB Manic iOS

on:
  workflow_dispatch:
  push:
    branches: [main, master, armsx2-native-integration, vita-native-integration]

permissions:
  contents: read
  actions: read

concurrency:
  group: xmb-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 150

    steps:
      - name: Checkout source (no LFS)
        uses: actions/checkout@v4
        with:
          lfs: false
          submodules: recursive

      # ARMSX2 is expensive to build, but the cached framework is valid only
      # when the embedded runtime/patch scripts are byte-for-byte identical.
      # Never bootstrap from an old IPA: that previously hid native PS2 fixes.
      - name: Restore cached ARMSX2 core
        id: armsx2-cache
        uses: actions/cache/restore@v4
        with:
          path: Cores/ARMSX2Core.framework
          key: armsx2core-v2-ios-xcode26.6-67be95a2-${{ hashFiles('Scripts/build_armsx2_core.sh', 'Scripts/patch_armsx2_embedded.py', 'Scripts/armsx2/**') }}

      - name: Checkout pinned ARMSX2 source
        if: steps.armsx2-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ARMSX2/ARMSX2
          ref: 67be95a2a6e689cfb11b3649bd58271aa6369a08
          path: ThirdParty/ARMSX2
          submodules: recursive
          lfs: false

      - name: Show commit being built
        run: |
          echo "Full SHA: $GITHUB_SHA"
          echo "Short SHA: ${GITHUB_SHA::7}"
          git log -1 --oneline

      - name: Ensure RswiftLibrary is linked
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("ManicEmu/ManicEmu.xcodeproj/project.pbxproj")
          text = p.read_text()

          print("Checking for RswiftLibrary references...")

          for line in text.splitlines():
              if "Rswift" in line:
                  print(line)
          PY

      - name: Patch ProHUD for Xcode 16
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("Dependencies/ProHUD/Sources/ProHUD/Core/Utils/AppContext.swift")
          lines = p.read_text().splitlines()

          out = []
          for line in lines:
              if "setNeedsUpdateOfPrefersInterfaceOrientationLocked()" in line:
                  indent = line[:len(line) - len(line.lstrip())]
                  out.append(indent + "#if compiler(>=6.2)")
                  out.append(line)
                  out.append(indent + "#endif")
              else:
                  out.append(line)

          p.write_text("\n".join(out) + "\n")
          PY

      - name: Patch SF Symbol templates for Xcode 16
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("ManicEmu/ManicEmu/Resources/Assets.xcassets")

          changed = 0
          for p in root.rglob("*.svg"):
              s = p.read_text(errors="ignore")

              new = s.replace("Template v.7.0", "Template v.6.0")
              new = new.replace("Template format 7.0", "Template format 6.0")

              if new != s:
                  p.write_text(new)
                  print("Patched:", p)
                  changed += 1

          print("Patched SVG files:", changed)
          PY

      - name: Hydrate emulator assets from official Manic v2.0.1 release
        env:
          MANIC_RELEASE_TAG: v2.0.1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash Scripts/hydrate_release_assets.sh

      - name: Upload hydration diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Remaining-LFS-pointers
          path: remaining-lfs-pointers.txt
          if-no-files-found: ignore

      - name: Generate Citra headers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          BIN="Cores/Citra.framework/Citra"
          OUT="$RUNNER_TEMP/citra-headers"
          ZIP="$RUNNER_TEMP/classdump.zip"
          EXTRACT="$RUNNER_TEMP/classdump-extracted"

          mkdir -p "$OUT"
          mkdir -p "$EXTRACT"

          echo "Finding latest classdump release..."

          python3 - <<'PY'
          import json
          import urllib.request
          import os

          api = "https://api.github.com/repos/lechium/classdumpios/releases/latest"

          token = os.environ.get("GITHUB_TOKEN")

          headers = {
              "User-Agent": "xmb-manic-actions",
              "Accept": "application/vnd.github+json",
          }

          if token:
              headers["Authorization"] = f"Bearer {token}"

          req = urllib.request.Request(
              api,
              headers=headers
          )

          with urllib.request.urlopen(req) as r:
              release = json.load(r)

          assets = release.get("assets", [])

          print("Available assets:")
          for asset in assets:
              print(" -", asset["name"])

          asset = None

          for item in assets:
              name = item["name"].lower()

              if name.endswith(".zip") and "classdump" in name:
                  asset = item
                  break

          if asset is None:
              raise SystemExit("No classdump ZIP asset found")

          url = asset["browser_download_url"]

          output = os.path.join(
              os.environ["RUNNER_TEMP"],
              "classdump.zip"
          )

          print("Downloading:", asset["name"])

          req = urllib.request.Request(
              url,
              headers=headers
          )

          with urllib.request.urlopen(req) as r, open(output, "wb") as f:
              f.write(r.read())

          print("Saved to:", output)
          PY

          echo "=== Downloaded file ==="
          file "$ZIP"

          echo "=== Extracting ==="
          unzip -q "$ZIP" -d "$EXTRACT"

          echo "=== Extracted contents ==="
          find "$EXTRACT" -maxdepth 3 -type f -print

          CLASSDUMP="$EXTRACT/Release/classdumpc"

          if [ ! -f "$CLASSDUMP" ]; then
            echo "Could not find macOS classdump executable"
            find "$EXTRACT" -maxdepth 3 -type f -print
            exit 1
          fi

          if [ -z "$CLASSDUMP" ]; then
            echo "Could not find classdump executable"
            exit 1
          fi

          echo "Using classdump:"
          echo "$CLASSDUMP"

          chmod +x "$CLASSDUMP"

          echo "=== classdump file type ==="
          file "$CLASSDUMP"

          echo "Dumping Citra Objective-C headers..."

          "$CLASSDUMP" \
            -H \
            -o "$OUT" \
            "$BIN"

          echo "=== Generated headers ==="
          find "$OUT" -maxdepth 2 -type f -print

          echo "Sanitizing generated Citra headers..."

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          root = Path(os.environ["RUNNER_TEMP"]) / "citra-headers"

          for header in root.glob("*.h"):
              text = header.read_text(errors="ignore")

              # Fix bogus superclass detected by classdump.
              text = text.replace(
                  ": udioComponentInstanceNew",
                  ": NSObject"
              )

              # Remove bogus import.
              text = re.sub(
                  r'^\s*#import\s+"udioComponentInstanceNew\.h"\s*$',
                  '',
                  text,
                  flags=re.MULTILINE
              )

              # Remove invalid generated C++ destructor selector.
              text = re.sub(
                  r'^\s*-\s*\(void\)\.cxx_destruct;\s*$',
                  '',
                  text,
                  flags=re.MULTILINE
              )

              # Make shared singleton methods non-optional in Swift.
              text = re.sub(
                  r'\+\s*\(instancetype\)\s*shared\s*;',
                  '+ (instancetype _Nonnull)shared;',
                  text
              )

              text = re.sub(
                  r'\+\s*\(id\)\s*shared\s*;',
                  '+ (instancetype _Nonnull)shared;',
                  text
              )

              header.write_text(text)

          # ----------------------------------------------------------
          # CitraCheatsManager
          # ----------------------------------------------------------

          cheats = root / "CitraCheatsManager.h"

          if cheats.exists():
              text = cheats.read_text(errors="ignore")

              text = re.sub(
                  r'\+\s*\([^)]*\)\s*shared\s*;',
                  '+ (instancetype _Nonnull)shared;',
                  text
              )

              if "@class CitraCheat;" not in text:
                  text = "@class CitraCheat;\n" + text

              text = re.sub(
                  r'-\s*\(id\)\s*cheatFilePath\s*;',
                  '- (NSString * _Nonnull)cheatFilePath;',
                  text
              )

              text = re.sub(
                  r'-\s*\(id\)\s*getCheats\s*;',
                  '- (NSArray<CitraCheat *> * _Nonnull)getCheats;',
                  text
              )

              text = re.sub(
                  r'-\s*\(void\)updateCheat:\(id\)(\w+)\s+atIndex:\(unsigned long long\)(\w+)\s*;',
                  r'- (void)updateCheat:(CitraCheat * _Nonnull)\1 atIndex:(NSUInteger)\2 NS_SWIFT_NAME(update(_:at:));',
                  text
              )

              text = re.sub(
                  r'-\s*\(void\)updateCheat:\(id\)(\w+)\s+at:\(unsigned long long\)(\w+)\s*;',
                  r'- (void)updateCheat:(CitraCheat * _Nonnull)\1 at:(NSUInteger)\2 NS_SWIFT_NAME(update(_:at:));',
                  text
              )

              cheats.write_text(text)

          # ----------------------------------------------------------
          # Reconstruct enum types lost by classdump
          # ----------------------------------------------------------

          types = root / "CitraTypes.h"

          types.write_text(r"""
          #import <Foundation/Foundation.h>

          typedef NS_ENUM(NSUInteger, CitraVirtualControllerButtonType) {
              CitraVirtualControllerButtonTypeA = 0,
              CitraVirtualControllerButtonTypeB = 1,
              CitraVirtualControllerButtonTypeX = 2,
              CitraVirtualControllerButtonTypeY = 3,
              CitraVirtualControllerButtonTypeDirectionalPadUp = 4,
              CitraVirtualControllerButtonTypeDirectionalPadDown = 5,
              CitraVirtualControllerButtonTypeDirectionalPadLeft = 6,
              CitraVirtualControllerButtonTypeDirectionalPadRight = 7,
              CitraVirtualControllerButtonTypeTriggerL = 8,
              CitraVirtualControllerButtonTypeTriggerR = 9,
              CitraVirtualControllerButtonTypeStart = 10,
              CitraVirtualControllerButtonTypeSelect = 11,
              CitraVirtualControllerButtonTypeDebug = 12,
              CitraVirtualControllerButtonTypeGpio14 = 13,
              CitraVirtualControllerButtonTypeTriggerZL = 14,
              CitraVirtualControllerButtonTypeTriggerZR = 15,
              CitraVirtualControllerButtonTypeHome = 16,
              CitraVirtualControllerButtonTypePower = 17,
          };

          typedef NS_ENUM(NSUInteger, CitraVirtualControllerThumbstickType) {
              CitraVirtualControllerThumbstickTypeCirclePad = 0,
              CitraVirtualControllerThumbstickTypeCStick = 1,
          };

          typedef NS_ENUM(NSUInteger, CitraKeyboardButtonConfig) {
              CitraKeyboardButtonConfigSingle = 0,
              CitraKeyboardButtonConfigDual = 1,
              CitraKeyboardButtonConfigTriple = 2,
              CitraKeyboardButtonConfigNone = 3,
          };

          typedef NS_ENUM(NSUInteger, CitraKeyboardAcceptedInput) {
              CitraKeyboardAcceptedInputAnything = 0,
              CitraKeyboardAcceptedInputNotEmpty = 1,
              CitraKeyboardAcceptedInputNotEmptyNotBlank = 2,
              CitraKeyboardAcceptedInputFixedLength = 3,
          };

          typedef NS_ENUM(NSUInteger, CitraImportGameResult) {
              CitraImportGameResultSuccess = 0,
              CitraImportGameResultErrorFailedToOpenFile = 1,
              CitraImportGameResultErrorFileNotFound = 2,
              CitraImportGameResultErrorAborted = 3,
              CitraImportGameResultErrorInvalid = 4,
              CitraImportGameResultErrorEncrypted = 5,
          };
          """)

          # ----------------------------------------------------------
          # CitraKeyboardConfig
          # ----------------------------------------------------------

          keyboard = root / "CitraKeyboardConfig.h"

          if keyboard.exists():
              text = keyboard.read_text(errors="ignore")

              if '#import "CitraTypes.h"' not in text:
                  text = '#import "CitraTypes.h"\n' + text

              text = re.sub(
                  r'@property\([^\n]*\)\s*unsigned long long\s+buttonConfig\s*;',
                  '@property(nonatomic) CitraKeyboardButtonConfig buttonConfig;',
                  text
              )

              text = re.sub(
                  r'@property\([^\n]*\)\s*unsigned long long\s+acceptedInput\s*;',
                  '@property(nonatomic) CitraKeyboardAcceptedInput acceptedInput;',
                  text
              )

              text = re.sub(
                  r'@property\(([^\n]*)\)\s*NSArray\s*\*\s*buttonText\s*;',
                  r'@property(\1) NSArray<NSString *> * _Nullable buttonText;',
                  text
              )

              keyboard.write_text(text)

          # ----------------------------------------------------------
          # CitraCore
          # ----------------------------------------------------------

          core = root / "CitraCore.h"

          if core.exists():
              text = core.read_text(errors="ignore")

              if "#import <UIKit/UIKit.h>" not in text:
                  text = "#import <UIKit/UIKit.h>\n" + text

              if "#import <QuartzCore/QuartzCore.h>" not in text:
                  text = "#import <QuartzCore/QuartzCore.h>\n" + text

              if "@class CitraSaveStateResult;" not in text:
                  text = "@class CitraSaveStateResult;\n" + text

              if "@class CitraGameInformation;" not in text:
                  text = "@class CitraGameInformation;\n" + text

              # Make shared() non-optional.
              text = re.sub(
                  r'\+\s*\(id\)\s*shared\s*;',
                  '+ (instancetype _Nonnull)shared;',
                  text
              )

              text = re.sub(
                  r'\+\s*\(id\s*_\s*Nullable\)\s*shared\s*;',
                  '+ (instancetype _Nonnull)shared;',
                  text
              )

              text = re.sub(
                  r'\+\s*\(id\s*_\s*Nonnull\)\s*shared\s*;',
                  '+ (instancetype _Nonnull)shared;',
                  text
              )

              text = re.sub(
                  r'\+\s*\(instancetype\)\s*shared\s*;',
                  '+ (instancetype _Nonnull)shared;',
                  text
              )

              if '#import "CitraTypes.h"' not in text:
                  text = '#import "CitraTypes.h"\n' + text

              # Restore controller button argument type.
              text = re.sub(
                  r'-\s*\(void\)virtualControllerButtonDown:\(unsigned long long\)(\w+)\s*;',
                  r'- (void)virtualControllerButtonDown:(CitraVirtualControllerButtonType)\1;',
                  text
              )

              text = re.sub(
                  r'-\s*\(void\)virtualControllerButtonUp:\(unsigned long long\)(\w+)\s*;',
                  r'- (void)virtualControllerButtonUp:(CitraVirtualControllerButtonType)\1;',
                  text
              )

              # Restore thumbstick argument type.
              text = re.sub(
                  r'-\s*\(void\)thumbstickMoved:\(unsigned long long\)(\w+)\s+x:\(float\)(\w+)\s+y:\(float\)(\w+)\s*;',
                  r'- (void)thumbstickMoved:(CitraVirtualControllerThumbstickType)\1 x:(float)\2 y:(float)\3;',
                  text
              )

              # Restore game-import result enum.
              text = re.sub(
                  r'-\s*\(unsigned long long\)importGameAtURL:\(id\)(\w+)\s*;',
                  r'- (CitraImportGameResult)importGameAtURL:(NSURL * _Nonnull)\1;',
                  text
              )

              # Keyboard callback as writable class property.
              text = text.replace(
                  '+ (void)setOpenKeyboardAction:(CDUnknownBlockType)arg1;\n+ (CDUnknownBlockType)openKeyboardAction;',
                  '@property(class, nonatomic, copy, nullable) CDUnknownBlockType openKeyboardAction;'
              )

              # Orientation type.
              text = text.replace(
                  '- (void)orientationChangeWithOrientation:(long long)arg1 metalView:(id)arg2;',
                  '- (void)orientationChangeWithOrientation:(UIInterfaceOrientation)arg1 metalView:(UIView * _Nonnull)arg2;'
              )

              # Save-state return type.
              text = text.replace(
                  '- (id)saveState;',
                  '- (CitraSaveStateResult * _Nullable)saveState;'
              )

              text = text.replace(
                  '- (id)saveStatePathForRunningGameWithSlot:(unsigned int)arg1;',
                  '- (NSString * _Nullable)saveStatePathForRunningGameWithSlot:(unsigned int)arg1;'
              )

              # Metal layer type.
              text = text.replace(
                  '- (void)allocateMetalLayer:(id)arg1 withSize:(struct CGSize)arg2 isSecondary:(_Bool)arg3;',
                  '- (void)allocateMetalLayer:(CALayer * _Nonnull)arg1 withSize:(CGSize)arg2 isSecondary:(_Bool)arg3;'
              )

              # Cartridge URL.
              text = text.replace(
                  '- (void)insertCartridgeAndBootWithURL:(id)arg1 advancedMode:(_Bool)arg2 jitSupport:(_Bool)arg3;',
                  '- (void)insertCartridgeAndBootWithURL:(NSURL * _Nonnull)arg1 advancedMode:(_Bool)arg2 jitSupport:(_Bool)arg3;'
              )

              # Keyboard callback nullability.
              text = text.replace(
                  'typedef void (^CDUnknownBlockType)(CitraKeyboardConfig *config);',
                  'typedef void (^CDUnknownBlockType)(CitraKeyboardConfig * _Nullable config);'
              )

              # CIA path getter.
              text = text.replace(
                  '- (id)getCIAContentPathWithIdentifier:(unsigned long long)arg1 isSdmc:(_Bool)arg2;',
                  '- (NSString * _Nullable)getCIAContentPathWithIdentifier:(unsigned long long)arg1 isSdmc:(_Bool)arg2;'
              )

              # Installed-title path getter.
              text = text.replace(
                  '- (id)getTitlePathWithIdentifier:(unsigned long long)arg1 isSdmc:(_Bool)arg2;',
                  '- (NSString * _Nullable)getTitlePathWithIdentifier:(unsigned long long)arg1 isSdmc:(_Bool)arg2;'
              )

              prefix = '''
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #import <QuartzCore/QuartzCore.h>

          @class CitraKeyboardConfig;
          @class CitraSaveStateResult;

          typedef void (^CDUnknownBlockType)(CitraKeyboardConfig * _Nullable config);

          '''

              if "typedef void (^CDUnknownBlockType)" not in text:
                  text = prefix + text

              text = text.replace(
                  '- (id)informationForGameAtURL:(id)arg1;',
                  '- (CitraGameInformation * _Nullable)informationForGameAtURL:(NSURL * _Nonnull)arg1 NS_SWIFT_NAME(information(for:));'
              )

              core.write_text(text)

          print("Sanitized Citra headers")
          PY

          mkdir -p Cores/Citra.framework/Headers
          mkdir -p Cores/Citra.framework/Modules

          echo "Copying all generated Citra headers..."

          cp "$OUT"/*.h \
             Cores/Citra.framework/Headers/

          cat > Cores/Citra.framework/Headers/Citra.h <<'EOF'
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #import <QuartzCore/QuartzCore.h>

          #import "CitraTypes.h"
          #import "CitraKeyboardConfig.h"
          #import "CitraCIAInfo.h"
          #import "CitraSaveStateInfo.h"
          #import "CitraSaveStateResult.h"
          #import "CitraGameInformation.h"
          #import "CitraCoreVersion.h"
          #import "CitraCheat.h"
          #import "CitraCheatsManager.h"
          #import "CitraCore.h"
          EOF

          cat > Cores/Citra.framework/Modules/module.modulemap <<'EOF'
          framework module Citra {
            header "Citra.h"
            export *
          }
          EOF

          echo "=== Reconstructed Citra framework ==="

          find Cores/Citra.framework/Headers \
               Cores/Citra.framework/Modules \
               -type f -maxdepth 2 -print

          echo "=== Sanitized CitraCore.h ==="
          sed -n '1,220p' Cores/Citra.framework/Headers/CitraCore.h || true

          echo "=== Sanitized CitraKeyboardConfig.h ==="
          sed -n '1,220p' Cores/Citra.framework/Headers/CitraKeyboardConfig.h || true

          echo "=== Sanitized CitraCheatsManager.h ==="
          sed -n '1,220p' Cores/Citra.framework/Headers/CitraCheatsManager.h || true

          echo "=== Reconstructed CitraTypes.h ==="
          cat Cores/Citra.framework/Headers/CitraTypes.h || true

          echo "=== Citra Objective-C symbols of interest ==="
          nm -gU "$BIN" 2>/dev/null | grep -Ei 'Citra|Keyboard|Cheat|thumb|virtualController|importGame' | head -300 || true

          echo "=== Citra strings of interest ==="
          strings "$BIN" | grep -Ei 'updateCheat|cheatFilePath|getCheats|buttonConfig|acceptedInput|circlePad|cStick|importGame' | head -300 || true

      - name: Refuse to compile with unresolved LFS pointers
        run: |
          if [ -s remaining-lfs-pointers.txt ]; then
            # System.core is replaced after xcodebuild with the real archive from
            # the official release, so unresolved pointers inside its source tree
            # are allowed. Every other unresolved LFS object is still fatal.
            grep -v '^System\.core/' remaining-lfs-pointers.txt > remaining-lfs-required.txt || true

            if [ -s remaining-lfs-required.txt ]; then
              echo 'Some required upstream LFS assets were not present in the official release bundle.'
              cat remaining-lfs-required.txt
              exit 2
            fi

            echo 'Only System.core LFS pointers remain; the final app resource will be restored from the official IPA.'
          fi

      - name: Restore incremental ARMSX2 build cache
        if: steps.armsx2-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/armsx2-core-build
          key: armsx2-build-v2-ios-xcode26.6-67be95a2-${{ hashFiles('Scripts/build_armsx2_core.sh', 'Scripts/patch_armsx2_embedded.py', 'Scripts/armsx2/**') }}
          restore-keys: |
            armsx2-build-v2-ios-xcode26.6-67be95a2-
            armsx2-build-ios-xcode26.6-67be95a2-

      - name: Build embedded ARMSX2 PS2 core
        if: steps.armsx2-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          chmod +x Scripts/build_armsx2_core.sh
          Scripts/build_armsx2_core.sh ThirdParty/ARMSX2

      - name: Save incremental ARMSX2 build cache
        if: steps.armsx2-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/armsx2-core-build
          key: armsx2-build-v2-ios-xcode26.6-67be95a2-${{ hashFiles('Scripts/build_armsx2_core.sh', 'Scripts/patch_armsx2_embedded.py', 'Scripts/armsx2/**') }}

      - name: Validate embedded ARMSX2 PS2 core
        run: |
          set -euo pipefail
          test -d Cores/ARMSX2Core.framework
          test -f Cores/ARMSX2Core.framework/ARMSX2Core

          BIN=Cores/ARMSX2Core.framework/ARMSX2Core
          echo "ARMSX2Core dependencies:"
          du -sh Cores/ARMSX2Core.framework
          otool -L "$BIN" || true

          # These markers exist only in the current embedded runtime. If either is
          # absent, fail instead of packaging a stale framework from an older IPA/cache.
          strings "$BIN" | grep -F "[Embedded] Installed ARMSX2 VM boot observer"
          strings "$BIN" | grep -F "[Embedded] Posting normal ARMSX2 VM boot request"
          echo "Verified current native ARMSX2 embedded boot path."

      - name: Save ARMSX2 core cache immediately
        if: steps.armsx2-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Cores/ARMSX2Core.framework
          key: armsx2core-v2-ios-xcode26.6-67be95a2-${{ hashFiles('Scripts/build_armsx2_core.sh', 'Scripts/patch_armsx2_embedded.py', 'Scripts/armsx2/**') }}

      # Vita3K is a linked, GPL-licensed native framework, not a second IPA.
      - name: Restore compiled Vita3K runtime
        id: vita-runtime-cache
        uses: actions/cache/restore@v4
        with:
          path: Cores/Vita3KManicRuntime.framework
          key: vita3k-manic-ios26-v3-${{ hashFiles('Vendor/Tsubomi/ios/CMakeLists.txt', 'Vendor/Tsubomi/ios/src/ManicRuntime.cpp', 'Vendor/Tsubomi/ios/include/vita3k_ios/ManicRuntime.h', 'Scripts/build_vita3k_runtime.sh') }}

      - name: Restore Vita3K vcpkg package cache
        if: steps.vita-runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vita3k-vcpkg-ios26-${{ hashFiles('Vendor/Tsubomi/vcpkg.json') }}-v1
          restore-keys: |
            vita3k-vcpkg-ios26-

      - name: Build embedded native Vita3K core
        if: steps.vita-runtime-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          bash Scripts/build_vita3k_runtime.sh 2>&1 | tee "$RUNNER_TEMP/vita3k-build.log"

      - name: Cache linked Vita3K framework
        if: steps.vita-runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Cores/Vita3KManicRuntime.framework
          key: vita3k-manic-ios26-v3-${{ hashFiles('Vendor/Tsubomi/ios/CMakeLists.txt', 'Vendor/Tsubomi/ios/src/ManicRuntime.cpp', 'Vendor/Tsubomi/ios/include/vita3k_ios/ManicRuntime.h', 'Scripts/build_vita3k_runtime.sh') }}

      - name: Validate Vita3K framework and update Manic link settings
        run: |
          set -euo pipefail
          test -f Cores/Vita3KManicRuntime.framework/Vita3KManicRuntime
          test -f Cores/Vita3KManicRuntime.framework/Headers/ManicRuntime.h
          nm -gU Cores/Vita3KManicRuntime.framework/Vita3KManicRuntime | grep -q '_manic_vita3k_run'
          python3 Scripts/vita/patch_manic_project.py
          plutil -lint ManicEmu/ManicEmu.xcodeproj/project.pbxproj

      - name: Show Xcode version and schemes
        working-directory: ManicEmu
        run: |
          xcodebuild -version
          xcodebuild -project ManicEmu.xcodeproj -list

      - name: Restore Swift package source cache
        id: swiftpm-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: swiftpm-ios-xcode26.6-${{ hashFiles('ManicEmu/ManicEmu.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Resolve Swift packages
        working-directory: ManicEmu
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project ManicEmu.xcodeproj \
            -scheme ManicEmuSideload \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -skipPackagePluginValidation

      - name: Save Swift package source cache immediately
        if: steps.swiftpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: swiftpm-ios-xcode26.6-${{ hashFiles('ManicEmu/ManicEmu.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Build unsigned iPhone app
        working-directory: ManicEmu
        run: |
          set -o pipefail
          export MANIC_ALLOW_SYSTEM_CORE_LFS_POINTERS=1
          xcodebuild \
            -project ManicEmu.xcodeproj \
            -scheme ManicEmuSideload \
            -configuration SideloadRelease \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM= \
            IPHONEOS_DEPLOYMENT_TARGET=17.4 \
            build | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Embed ARMSX2Core framework
        run: |
          set -euo pipefail
          APP=$(find "$RUNNER_TEMP/DerivedData/Build/Products" -type d -name '*.app' | head -1)
          test -n "$APP"
          test -d "$GITHUB_WORKSPACE/Cores/ARMSX2Core.framework"

          mkdir -p "$APP/Frameworks"
          rm -rf "$APP/Frameworks/ARMSX2Core.framework"
          ditto "$GITHUB_WORKSPACE/Cores/ARMSX2Core.framework" "$APP/Frameworks/ARMSX2Core.framework"

          MANIC_BIN="$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          echo "Manic executable linkage:"
          otool -L "$MANIC_BIN" | grep -E 'ARMSX2Core|@rpath' || true

          echo "Bundled ARMSX2 framework:"
          du -sh "$APP/Frameworks/ARMSX2Core.framework"
          otool -L "$APP/Frameworks/ARMSX2Core.framework/ARMSX2Core" || true

      - name: Embed linked Vita3K runtime and shaders
        run: |
          set -euo pipefail
          APP=$(find "$RUNNER_TEMP/DerivedData/Build/Products" -type d -name '*.app' | head -1)
          test -n "$APP"
          mkdir -p "$APP/Frameworks"
          ditto "$GITHUB_WORKSPACE/Cores/Vita3KManicRuntime.framework" "$APP/Frameworks/Vita3KManicRuntime.framework"
          test -f "$APP/Frameworks/Vita3KManicRuntime.framework/Vita3KManicRuntime"
          ditto "$GITHUB_WORKSPACE/Vendor/Tsubomi/vita3k/shaders-builtin" "$APP/shaders-builtin"
          BIN="$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          otool -L "$BIN" | grep -F "Vita3KManicRuntime.framework"
          echo "Native Vita3K framework and shaders are present in Manic."

      - name: Restore real System.core with controller skins
        env:
          MANIC_RELEASE_TAG: v2.0.1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          OFFICIAL_IPA="$RUNNER_TEMP/manic-official.ipa"
          OFFICIAL_DIR="$RUNNER_TEMP/manic-official"

          python3 - <<'PY'
          import json
          import os
          import urllib.request

          tag = os.environ["MANIC_RELEASE_TAG"]
          token = os.environ.get("GITHUB_TOKEN")
          api = f"https://api.github.com/repos/Manic-EMU/ManicEMU/releases/tags/{tag}"

          headers = {
              "User-Agent": "xmb-manic-actions",
              "Accept": "application/vnd.github+json",
          }
          if token:
              headers["Authorization"] = f"Bearer {token}"

          request = urllib.request.Request(api, headers=headers)
          with urllib.request.urlopen(request) as response:
              release = json.load(response)

          ipa = next(
              (asset for asset in release.get("assets", [])
               if asset["name"].lower().endswith(".ipa")),
              None
          )

          if ipa is None:
              raise SystemExit("Could not find an official IPA asset")

          output = os.path.join(os.environ["RUNNER_TEMP"], "manic-official.ipa")
          download_headers = {"User-Agent": "xmb-manic-actions"}
          request = urllib.request.Request(ipa["browser_download_url"], headers=download_headers)

          print("Downloading official IPA:", ipa["name"])
          with urllib.request.urlopen(request) as response, open(output, "wb") as f:
              while True:
                  chunk = response.read(1024 * 1024)
                  if not chunk:
                      break
                  f.write(chunk)

          print("Official IPA saved:", output)
          PY

          rm -rf "$OFFICIAL_DIR"
          mkdir -p "$OFFICIAL_DIR"
          unzip -q "$OFFICIAL_IPA" -d "$OFFICIAL_DIR"

          OFFICIAL_CORE=$(find "$OFFICIAL_DIR/Payload" -name 'System.core' -type f | head -1)

          if [ -z "$OFFICIAL_CORE" ]; then
            echo "Official IPA does not contain System.core"
            find "$OFFICIAL_DIR/Payload" -maxdepth 3 -print
            exit 1
          fi

          echo "Official System.core:"
          ls -lh "$OFFICIAL_CORE"

          echo "Checking controller skins inside official System.core..."
          unzip -l "$OFFICIAL_CORE" | grep -E \
            '3DS(_FLEX)?\.manicskin|PS1(_FLEX)?\.manicskin|PSP(_FLEX)?\.manicskin|N64(_FLEX)?\.manicskin|GBA(_FLEX)?\.manicskin'

          APP=$(find "$RUNNER_TEMP/DerivedData/Build/Products" -type d -name '*.app' | head -1)

          if [ -z "$APP" ]; then
            echo "Built app not found"
            exit 1
          fi

          rm -rf "$APP/System.core"
          cp "$OFFICIAL_CORE" "$APP/System.core"

          echo "Installed real System.core:"
          ls -lh "$APP/System.core"

          echo "Verifying installed controller skins..."
          unzip -l "$APP/System.core" | grep -E \
            '3DS(_FLEX)?\.manicskin|PS1(_FLEX)?\.manicskin|PSP(_FLEX)?\.manicskin'

      - name: Package unsigned IPA
        if: success()
        run: |
          APP=$(find "$RUNNER_TEMP/DerivedData/Build/Products" -type d -name '*.app' | head -1)
          test -n "$APP"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry ManicEMU-XMB-unsigned.ipa Payload

      - name: Upload unsigned IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ManicEMU-XMB-unsigned-IPA
          path: ${{ runner.temp }}/ManicEMU-XMB-unsigned.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xcode-build-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore

      - name: Upload Vita3K build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Vita3K-native-build-log
          path: ${{ runner.temp }}/vita3k-build.log
          if-no-files-found: ignore

      - name: Upload ARMSX2 build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ARMSX2-Xcode-build-log
          path: ${{ runner.temp }}/armsx2-xcodebuild.log
          if-no-files-found: ignore
