name: Build XMB Manic iOS

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout source (no LFS)
        uses: actions/checkout@v4
        with:
          lfs: false
          submodules: recursive

      - name: Show commit being built
        run: |
          echo "Full SHA: $GITHUB_SHA"
          echo "Short SHA: ${GITHUB_SHA::7}"
          git log -1 --oneline

      - name: Ensure RswiftLibrary is linked
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("ManicEmu/ManicEmu.xcodeproj/project.pbxproj")
          text = p.read_text()

          print("Checking for RswiftLibrary references...")

          for line in text.splitlines():
              if "Rswift" in line:
                  print(line)
          PY

      - name: Patch ProHUD for Xcode 16
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("Dependencies/ProHUD/Sources/ProHUD/Core/Utils/AppContext.swift")
          lines = p.read_text().splitlines()

          out = []
          for line in lines:
              if "setNeedsUpdateOfPrefersInterfaceOrientationLocked()" in line:
                  indent = line[:len(line) - len(line.lstrip())]
                  out.append(indent + "#if compiler(>=6.2)")
                  out.append(line)
                  out.append(indent + "#endif")
              else:
                  out.append(line)

          p.write_text("\n".join(out) + "\n")
          PY

      - name: Patch SF Symbol templates for Xcode 16
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("ManicEmu/ManicEmu/Resources/Assets.xcassets")

          changed = 0
          for p in root.rglob("*.svg"):
              s = p.read_text(errors="ignore")

              new = s.replace("Template v.7.0", "Template v.6.0")
              new = new.replace("Template format 7.0", "Template format 6.0")

              if new != s:
                  p.write_text(new)
                  print("Patched:", p)
                  changed += 1

          print("Patched SVG files:", changed)
          PY

      - name: Hydrate emulator assets from official Manic v2.0.1 release
        env:
          MANIC_RELEASE_TAG: v2.0.1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash Scripts/hydrate_release_assets.sh

      - name: Upload hydration diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Remaining-LFS-pointers
          path: remaining-lfs-pointers.txt
          if-no-files-found: ignore

      - name: Generate Citra headers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          BIN="Cores/Citra.framework/Citra"
          OUT="$RUNNER_TEMP/citra-headers"
          ZIP="$RUNNER_TEMP/classdump.zip"
          EXTRACT="$RUNNER_TEMP/classdump-extracted"

          mkdir -p "$OUT"
          mkdir -p "$EXTRACT"

          echo "Finding latest classdump release..."

          python3 - <<'PY'
          import json
          import urllib.request
          import os

          api = "https://api.github.com/repos/lechium/classdumpios/releases/latest"

          token = os.environ.get("GITHUB_TOKEN")

          headers = {
              "User-Agent": "xmb-manic-actions",
              "Accept": "application/vnd.github+json",
          }

          if token:
              headers["Authorization"] = f"Bearer {token}"

          req = urllib.request.Request(
              api,
              headers=headers
          )

          with urllib.request.urlopen(req) as r:
              release = json.load(r)

          assets = release.get("assets", [])

          print("Available assets:")
          for asset in assets:
              print(" -", asset["name"])

          asset = None

          for item in assets:
              name = item["name"].lower()

              if name.endswith(".zip") and "classdump" in name:
                  asset = item
                  break

          if asset is None:
              raise SystemExit("No classdump ZIP asset found")

          url = asset["browser_download_url"]

          output = os.path.join(
              os.environ["RUNNER_TEMP"],
              "classdump.zip"
          )

          print("Downloading:", asset["name"])

          req = urllib.request.Request(
              url,
              headers=headers
          )

          with urllib.request.urlopen(req) as r, open(output, "wb") as f:
              f.write(r.read())

          print("Saved to:", output)
          PY

          echo "=== Downloaded file ==="
          file "$ZIP"

          echo "=== Extracting ==="
          unzip -q "$ZIP" -d "$EXTRACT"

          echo "=== Extracted contents ==="
          find "$EXTRACT" -maxdepth 3 -type f -print

          CLASSDUMP="$EXTRACT/Release/classdumpc"

          if [ ! -f "$CLASSDUMP" ]; then
            echo "Could not find macOS classdump executable"
            find "$EXTRACT" -maxdepth 3 -type f -print
            exit 1
          fi

          if [ -z "$CLASSDUMP" ]; then
            echo "Could not find classdump executable"
            exit 1
          fi

          echo "Using classdump:"
          echo "$CLASSDUMP"

          chmod +x "$CLASSDUMP"

          echo "=== classdump file type ==="
          file "$CLASSDUMP"

          echo "Dumping Citra Objective-C headers..."

          "$CLASSDUMP" \
            -H \
            -o "$OUT" \
            "$BIN"

          echo "=== Generated headers ==="
          find "$OUT" -maxdepth 2 -type f -print

          echo "Sanitizing generated Citra headers..."

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          root = Path(os.environ["RUNNER_TEMP"]) / "citra-headers"

          for header in root.glob("*.h"):
              text = header.read_text(errors="ignore")

              # Fix bogus superclass detected by classdump.
              text = text.replace(
                  ": udioComponentInstanceNew",
                  ": NSObject"
              )

              # Remove bogus import.
              text = re.sub(
                  r'^\s*#import\s+"udioComponentInstanceNew\.h"\s*$',
                  '',
                  text,
                  flags=re.MULTILINE
              )

              # Remove invalid generated C++ destructor selector.
              text = re.sub(
                  r'^\s*-\s*\(void\)\.cxx_destruct;\s*$',
                  '',
                  text,
                  flags=re.MULTILINE
              )

              # Make shared singleton methods non-optional in Swift.
              text = re.sub(
                  r'\+\s*\(instancetype\)\s*shared\s*;',
                  '+ (instancetype _Nonnull)shared;',
                  text
              )

              text = re.sub(
                  r'\+\s*\(id\)\s*shared\s*;',
                  '+ (instancetype _Nonnull)shared;',
                  text
              )

              header.write_text(text)

          # ----------------------------------------------------------
          # CitraCheatsManager
          # ----------------------------------------------------------

          cheats = root / "CitraCheatsManager.h"

          if cheats.exists():
              text = cheats.read_text(errors="ignore")

              text = re.sub(
                  r'\+\s*\([^)]*\)\s*shared\s*;',
                  '+ (instancetype _Nonnull)shared;',
                  text
              )

              if "@class CitraCheat;" not in text:
                  text = "@class CitraCheat;\n" + text

              text = re.sub(
                  r'-\s*\(id\)\s*cheatFilePath\s*;',
                  '- (NSString * _Nonnull)cheatFilePath;',
                  text
              )

              text = re.sub(
                  r'-\s*\(id\)\s*getCheats\s*;',
                  '- (NSArray<CitraCheat *> * _Nonnull)getCheats;',
                  text
              )

              text = re.sub(
                  r'-\s*\(void\)updateCheat:\(id\)(\w+)\s+atIndex:\(unsigned long long\)(\w+)\s*;',
                  r'- (void)updateCheat:(CitraCheat * _Nonnull)\1 atIndex:(NSUInteger)\2 NS_SWIFT_NAME(update(_:at:));',
                  text
              )

              text = re.sub(
                  r'-\s*\(void\)updateCheat:\(id\)(\w+)\s+at:\(unsigned long long\)(\w+)\s*;',
                  r'- (void)updateCheat:(CitraCheat * _Nonnull)\1 at:(NSUInteger)\2 NS_SWIFT_NAME(update(_:at:));',
                  text
              )

              cheats.write_text(text)

          # ----------------------------------------------------------
          # Reconstruct enum types lost by classdump
          # ----------------------------------------------------------

          types = root / "CitraTypes.h"

          types.write_text(r"""
          #import <Foundation/Foundation.h>

          typedef NS_ENUM(NSUInteger, CitraVirtualControllerButtonType) {
              CitraVirtualControllerButtonTypeA = 0,
              CitraVirtualControllerButtonTypeB = 1,
              CitraVirtualControllerButtonTypeX = 2,
              CitraVirtualControllerButtonTypeY = 3,
              CitraVirtualControllerButtonTypeDirectionalPadUp = 4,
              CitraVirtualControllerButtonTypeDirectionalPadDown = 5,
              CitraVirtualControllerButtonTypeDirectionalPadLeft = 6,
              CitraVirtualControllerButtonTypeDirectionalPadRight = 7,
              CitraVirtualControllerButtonTypeTriggerL = 8,
              CitraVirtualControllerButtonTypeTriggerR = 9,
              CitraVirtualControllerButtonTypeStart = 10,
              CitraVirtualControllerButtonTypeSelect = 11,
              CitraVirtualControllerButtonTypeDebug = 12,
              CitraVirtualControllerButtonTypeGpio14 = 13,
              CitraVirtualControllerButtonTypeTriggerZL = 14,
              CitraVirtualControllerButtonTypeTriggerZR = 15,
              CitraVirtualControllerButtonTypeHome = 16,
              CitraVirtualControllerButtonTypePower = 17,
          };

          typedef NS_ENUM(NSUInteger, CitraVirtualControllerThumbstickType) {
              CitraVirtualControllerThumbstickTypeCirclePad = 0,
              CitraVirtualControllerThumbstickTypeCStick = 1,
          };

          typedef NS_ENUM(NSUInteger, CitraKeyboardButtonConfig) {
              CitraKeyboardButtonConfigSingle = 0,
              CitraKeyboardButtonConfigDual = 1,
              CitraKeyboardButtonConfigTriple = 2,
              CitraKeyboardButtonConfigNone = 3,
          };

          typedef NS_ENUM(NSUInteger, CitraKeyboardAcceptedInput) {
              CitraKeyboardAcceptedInputAnything = 0,
              CitraKeyboardAcceptedInputNotEmpty = 1,
              CitraKeyboardAcceptedInputNotEmptyNotBlank = 2,
              CitraKeyboardAcceptedInputFixedLength = 3,
          };

          typedef NS_ENUM(NSUInteger, CitraImportGameResult) {
              CitraImportGameResultSuccess = 0,
          };
          """)

          # ----------------------------------------------------------
          # CitraKeyboardConfig
          # ----------------------------------------------------------

          keyboard = root / "CitraKeyboardConfig.h"

          if keyboard.exists():
              text = keyboard.read_text(errors="ignore")

              if '#import "CitraTypes.h"' not in text:
                  text = '#import "CitraTypes.h"\n' + text

              text = re.sub(
                  r'@property\([^\n]*\)\s*unsigned long long\s+buttonConfig\s*;',
                  '@property(nonatomic) CitraKeyboardButtonConfig buttonConfig;',
                  text
              )

              text = re.sub(
                  r'@property\([^\n]*\)\s*unsigned long long\s+acceptedInput\s*;',
                  '@property(nonatomic) CitraKeyboardAcceptedInput acceptedInput;',
                  text
              )

              text = re.sub(
                  r'@property\(([^\n]*)\)\s*NSArray\s*\*\s*buttonText\s*;',
                  r'@property(\1) NSArray<NSString *> * _Nullable buttonText;',
                  text
              )

              keyboard.write_text(text)

          # ----------------------------------------------------------
          # CitraCore
          # ----------------------------------------------------------

          core = root / "CitraCore.h"

          if core.exists():
              text = core.read_text(errors="ignore")

              if "#import <UIKit/UIKit.h>" not in text:
                  text = "#import <UIKit/UIKit.h>\n" + text

              if "#import <QuartzCore/QuartzCore.h>" not in text:
                  text = "#import <QuartzCore/QuartzCore.h>\n" + text

              if "@class CitraSaveStateResult;" not in text:
                  text = "@class CitraSaveStateResult;\n" + text

              # Make shared() non-optional.
              text = re.sub(
                  r'\+\s*\(id\)\s*shared\s*;',
                  '+ (instancetype _Nonnull)shared;',
                  text
              )

              text = re.sub(
                  r'\+\s*\(id\s*_\s*Nullable\)\s*shared\s*;',
                  '+ (instancetype _Nonnull)shared;',
                  text
              )

              text = re.sub(
                  r'\+\s*\(id\s*_\s*Nonnull\)\s*shared\s*;',
                  '+ (instancetype _Nonnull)shared;',
                  text
              )

              text = re.sub(
                  r'\+\s*\(instancetype\)\s*shared\s*;',
                  '+ (instancetype _Nonnull)shared;',
                  text
              )

              if '#import "CitraTypes.h"' not in text:
                  text = '#import "CitraTypes.h"\n' + text

              # Restore controller button argument type.
              text = re.sub(
                  r'-\s*\(void\)virtualControllerButtonDown:\(unsigned long long\)(\w+)\s*;',
                  r'- (void)virtualControllerButtonDown:(CitraVirtualControllerButtonType)\1;',
                  text
              )

              text = re.sub(
                  r'-\s*\(void\)virtualControllerButtonUp:\(unsigned long long\)(\w+)\s*;',
                  r'- (void)virtualControllerButtonUp:(CitraVirtualControllerButtonType)\1;',
                  text
              )

              # Restore thumbstick argument type.
              text = re.sub(
                  r'-\s*\(void\)thumbstickMoved:\(unsigned long long\)(\w+)\s+x:\(float\)(\w+)\s+y:\(float\)(\w+)\s*;',
                  r'- (void)thumbstickMoved:(CitraVirtualControllerThumbstickType)\1 x:(float)\2 y:(float)\3;',
                  text
              )

              # Restore game-import result enum.
              text = re.sub(
                  r'-\s*\(unsigned long long\)importGameAtURL:\(id\)(\w+)\s*;',
                  r'- (CitraImportGameResult)importGameAtURL:(NSURL * _Nonnull)\1;',
                  text
              )

              # Keyboard callback as writable class property.
              text = text.replace(
                  '+ (void)setOpenKeyboardAction:(CDUnknownBlockType)arg1;\n+ (CDUnknownBlockType)openKeyboardAction;',
                  '@property(class, nonatomic, copy, nullable) CDUnknownBlockType openKeyboardAction;'
              )

              # Orientation type.
              text = text.replace(
                  '- (void)orientationChangeWithOrientation:(long long)arg1 metalView:(id)arg2;',
                  '- (void)orientationChangeWithOrientation:(UIInterfaceOrientation)arg1 metalView:(UIView * _Nonnull)arg2;'
              )

              # Save-state return type.
              text = text.replace(
                  '- (id)saveState;',
                  '- (CitraSaveStateResult * _Nullable)saveState;'
              )

              text = text.replace(
                  '- (id)saveStatePathForRunningGameWithSlot:(unsigned int)arg1;',
                  '- (NSString * _Nullable)saveStatePathForRunningGameWithSlot:(unsigned int)arg1;'
              )

              # Metal layer type.
              text = text.replace(
                  '- (void)allocateMetalLayer:(id)arg1 withSize:(struct CGSize)arg2 isSecondary:(_Bool)arg3;',
                  '- (void)allocateMetalLayer:(CALayer * _Nonnull)arg1 withSize:(CGSize)arg2 isSecondary:(_Bool)arg3;'
              )

              # Cartridge URL.
              text = text.replace(
                  '- (void)insertCartridgeAndBootWithURL:(id)arg1 advancedMode:(_Bool)arg2 jitSupport:(_Bool)arg3;',
                  '- (void)insertCartridgeAndBootWithURL:(NSURL * _Nonnull)arg1 advancedMode:(_Bool)arg2 jitSupport:(_Bool)arg3;'
              )

              # Keyboard callback nullability.
              text = text.replace(
                  'typedef void (^CDUnknownBlockType)(CitraKeyboardConfig *config);',
                  'typedef void (^CDUnknownBlockType)(CitraKeyboardConfig * _Nullable config);'
              )

              # CIA path getter.
              text = text.replace(
                  '- (id)getCIAContentPathWithIdentifier:(unsigned long long)arg1 isSdmc:(_Bool)arg2;',
                  '- (NSString * _Nullable)getCIAContentPathWithIdentifier:(unsigned long long)arg1 isSdmc:(_Bool)arg2;'
              )

              # Installed-title path getter.
              text = text.replace(
                  '- (id)getTitlePathWithIdentifier:(unsigned long long)arg1 isSdmc:(_Bool)arg2;',
                  '- (NSString * _Nullable)getTitlePathWithIdentifier:(unsigned long long)arg1 isSdmc:(_Bool)arg2;'
              )

              prefix = '''
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #import <QuartzCore/QuartzCore.h>

          @class CitraKeyboardConfig;
          @class CitraSaveStateResult;

          typedef void (^CDUnknownBlockType)(CitraKeyboardConfig * _Nullable config);

          '''

              if "typedef void (^CDUnknownBlockType)" not in text:
                  text = prefix + text

              core.write_text(text)

          print("Sanitized Citra headers")
          PY

          mkdir -p Cores/Citra.framework/Headers
          mkdir -p Cores/Citra.framework/Modules

          echo "Copying all generated Citra headers..."

          cp "$OUT"/*.h \
             Cores/Citra.framework/Headers/

          cat > Cores/Citra.framework/Headers/Citra.h <<'EOF'
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #import <QuartzCore/QuartzCore.h>

          #import "CitraTypes.h"
          #import "CitraKeyboardConfig.h"
          #import "CitraCIAInfo.h"
          #import "CitraSaveStateInfo.h"
          #import "CitraSaveStateResult.h"
          #import "CitraGameInformation.h"
          #import "CitraCoreVersion.h"
          #import "CitraCheat.h"
          #import "CitraCheatsManager.h"
          #import "CitraCore.h"
          EOF

          cat > Cores/Citra.framework/Modules/module.modulemap <<'EOF'
          framework module Citra {
            header "Citra.h"
            export *
          }
          EOF

          echo "=== Reconstructed Citra framework ==="

          find Cores/Citra.framework/Headers \
               Cores/Citra.framework/Modules \
               -type f -maxdepth 2 -print

          echo "=== Sanitized CitraCore.h ==="
          sed -n '1,220p' Cores/Citra.framework/Headers/CitraCore.h || true

          echo "=== Sanitized CitraKeyboardConfig.h ==="
          sed -n '1,220p' Cores/Citra.framework/Headers/CitraKeyboardConfig.h || true

          echo "=== Sanitized CitraCheatsManager.h ==="
          sed -n '1,220p' Cores/Citra.framework/Headers/CitraCheatsManager.h || true

          echo "=== Reconstructed CitraTypes.h ==="
          cat Cores/Citra.framework/Headers/CitraTypes.h || true

          echo "=== Citra Objective-C symbols of interest ==="
          nm -gU "$BIN" 2>/dev/null | grep -Ei 'Citra|Keyboard|Cheat|thumb|virtualController|importGame' | head -300 || true

          echo "=== Citra strings of interest ==="
          strings "$BIN" | grep -Ei 'updateCheat|cheatFilePath|getCheats|buttonConfig|acceptedInput|circlePad|cStick|importGame' | head -300 || true

      - name: Refuse to compile with unresolved LFS pointers
        run: |
          if [ -s remaining-lfs-pointers.txt ]; then
            echo 'Some required upstream LFS assets were not present in the official release bundle.'
            echo 'Download the Remaining-LFS-pointers artifact and send it back for the next patch.'
            exit 2
          fi

      - name: Show Xcode version and schemes
        working-directory: ManicEmu
        run: |
          xcodebuild -version
          xcodebuild -project ManicEmu.xcodeproj -list

      - name: Resolve Swift packages
        working-directory: ManicEmu
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project ManicEmu.xcodeproj \
            -scheme ManicEmuSideload \
            -skipPackagePluginValidation

      - name: Build unsigned iPhone app
        working-directory: ManicEmu
        run: |
          set -o pipefail
          xcodebuild \
            -project ManicEmu.xcodeproj \
            -scheme ManicEmuSideload \
            -configuration SideloadRelease \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM= \
            build | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Package unsigned IPA
        if: success()
        run: |
          APP=$(find "$RUNNER_TEMP/DerivedData/Build/Products" -type d -name '*.app' | head -1)
          test -n "$APP"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry ManicEMU-XMB-unsigned.ipa Payload

      - name: Upload unsigned IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ManicEMU-XMB-unsigned-IPA
          path: ${{ runner.temp }}/ManicEMU-XMB-unsigned.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xcode-build-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore